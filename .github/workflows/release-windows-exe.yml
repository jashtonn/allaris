name: Release Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.0)"
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained exe
        shell: pwsh
        run: ./scripts/build-windows-exe.ps1

      - name: Zip publish output
        shell: pwsh
        run: |
          $publishPath = "OutlookAgentBridge/bin/Release/net8.0-windows/win-x64/publish"
          $zipPath = "OutlookAgentBridge-win-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$publishPath/*" -DestinationPath $zipPath

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
          files: |
            OutlookAgentBridge-win-x64.zip
